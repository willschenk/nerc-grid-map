<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="NERC Grid Map role color palette">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset="1" stop-color="#111b3a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#23305b" stroke-width="1" opacity=".34"/></pattern>
    <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="920" height="430" rx="22" fill="url(#bg)"/>
  <rect width="920" height="430" rx="22" fill="url(#grid)" opacity=".75"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    .title{fill:#fff;font-size:30px;font-weight:800;letter-spacing:.2px}
    .sub{fill:#9aa8d9;font-size:15px}
    .role{fill:#fff;font-size:16px;font-weight:800}
    .name{fill:#c9d3ff;font-size:13px}
    .hex{fill:#8f9ac9;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .chip{fill:#101936;stroke:#263766;stroke-width:1.2}
  </style>
  <text x="46" y="56" class="title">Role color palette</text>
  <text x="46" y="84" class="sub">Anchors from src/lib/nerc/roles.mjs. Multi-role organizations blend between these colors.</text>

  <g transform="translate(46,118)">
    <g transform="translate(0,0)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#6f39d9" filter="url(#softGlow)"/><text x="50" y="24" class="role">RC</text><text x="50" y="42" class="name">Reliability Coordinator</text><text x="141" y="24" class="hex">#6f39d9</text></g>
    <g transform="translate(214,0)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#3650d2" filter="url(#softGlow)"/><text x="50" y="24" class="role">BA</text><text x="50" y="42" class="name">Balancing Authority</text><text x="141" y="24" class="hex">#3650d2</text></g>
    <g transform="translate(428,0)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#584dcf" filter="url(#softGlow)"/><text x="50" y="24" class="role">PC</text><text x="50" y="42" class="name">Planning Coordinator</text><text x="141" y="24" class="hex">#584dcf</text></g>
    <g transform="translate(642,0)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#1ba69b" filter="url(#softGlow)"/><text x="50" y="24" class="role">TOP</text><text x="50" y="42" class="name">Transmission Operator</text><text x="141" y="24" class="hex">#1ba69b</text></g>

    <g transform="translate(0,74)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#25b07d" filter="url(#softGlow)"/><text x="50" y="24" class="role">TSP</text><text x="50" y="42" class="name">Transmission Service</text><text x="141" y="24" class="hex">#25b07d</text></g>
    <g transform="translate(214,74)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#2cb364" filter="url(#softGlow)"/><text x="50" y="24" class="role">TP</text><text x="50" y="42" class="name">Transmission Planner</text><text x="141" y="24" class="hex">#2cb364</text></g>
    <g transform="translate(428,74)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#cd5027" filter="url(#softGlow)"/><text x="50" y="24" class="role">TO</text><text x="50" y="42" class="name">Transmission Owner</text><text x="141" y="24" class="hex">#cd5027</text></g>
    <g transform="translate(642,74)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#c96f20" filter="url(#softGlow)"/><text x="50" y="24" class="role">GO</text><text x="50" y="42" class="name">Generator Owner</text><text x="141" y="24" class="hex">#c96f20</text></g>

    <g transform="translate(0,148)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#c98f2a" filter="url(#softGlow)"/><text x="50" y="24" class="role">GOP</text><text x="50" y="42" class="name">Generator Operator</text><text x="141" y="24" class="hex">#c98f2a</text></g>
    <g transform="translate(214,148)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#60a92c" filter="url(#softGlow)"/><text x="50" y="24" class="role">LSE</text><text x="50" y="42" class="name">Load-Serving Entity</text><text x="141" y="24" class="hex">#60a92c</text></g>
    <g transform="translate(428,148)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#cc328c" filter="url(#softGlow)"/><text x="50" y="24" class="role">PSE</text><text x="50" y="42" class="name">Purchasing-Selling</text><text x="141" y="24" class="hex">#cc328c</text></g>
    <g transform="translate(642,148)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#839bb3" filter="url(#softGlow)"/><text x="50" y="24" class="role">DP</text><text x="50" y="42" class="name">Distribution Provider</text><text x="141" y="24" class="hex">#839bb3</text></g>

    <g transform="translate(0,222)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#79a0b3" filter="url(#softGlow)"/><text x="50" y="24" class="role">RP</text><text x="50" y="42" class="name">Resource Planner</text><text x="141" y="24" class="hex">#79a0b3</text></g>
    <g transform="translate(214,222)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#5998a5" filter="url(#softGlow)"/><text x="50" y="24" class="role">RSG</text><text x="50" y="42" class="name">Reserve Sharing</text><text x="141" y="24" class="hex">#5998a5</text></g>
    <g transform="translate(428,222)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#62a4a6" filter="url(#softGlow)"/><text x="50" y="24" class="role">FRSG</text><text x="50" y="42" class="name">Frequency Response</text><text x="141" y="24" class="hex">#62a4a6</text></g>
    <g transform="translate(642,222)"><rect class="chip" width="190" height="54" rx="14"/><circle cx="28" cy="27" r="13" fill="#6ba3a8" filter="url(#softGlow)"/><text x="50" y="24" class="role">RRSG</text><text x="50" y="42" class="name">Reactive Reserve</text><text x="141" y="24" class="hex">#6ba3a8</text></g>
  </g>

  <text x="46" y="398" class="sub">Higher-impact roles drive size and priority. Color is a visual cue, not a compliance classification.</text>
</svg>
