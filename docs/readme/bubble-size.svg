<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="Bubble size weights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset="1" stop-color="#111b3a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#23305b" stroke-width="1" opacity=".34"/></pattern>
  </defs>
  <rect width="920" height="300" rx="22" fill="url(#bg)"/>
  <rect width="920" height="300" rx="22" fill="url(#grid)" opacity=".75"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    .title{fill:#fff;font-size:30px;font-weight:800;letter-spacing:.2px}
    .sub{fill:#9aa8d9;font-size:15px}
    .weight{fill:#c9d3ff;font-size:13px;font-weight:800}
  </style>
  <text x="46" y="56" class="title">Bubble size weights</text>
  <text x="46" y="84" class="sub">Bubble size is scaled by role weights; larger roles get bigger bubbles.</text>
  <circle cx="140" cy="170" r="34" fill="#6f39d9" opacity="0.85"/>
  <text x="140" y="224" text-anchor="middle" class="weight">10</text>
  <circle cx="220" cy="170" r="30" fill="#6f39d9" opacity="0.85"/>
  <text x="220" y="220" text-anchor="middle" class="weight">8</text>
  <circle cx="300" cy="170" r="28" fill="#6f39d9" opacity="0.85"/>
  <text x="300" y="218" text-anchor="middle" class="weight">7</text>
  <circle cx="380" cy="170" r="26" fill="#6f39d9" opacity="0.85"/>
  <text x="380" y="216" text-anchor="middle" class="weight">6</text>
  <circle cx="460" cy="170" r="24" fill="#6f39d9" opacity="0.85"/>
  <text x="460" y="214" text-anchor="middle" class="weight">5</text>
  <circle cx="540" cy="170" r="22" fill="#6f39d9" opacity="0.85"/>
  <text x="540" y="212" text-anchor="middle" class="weight">4</text>
  <circle cx="620" cy="170" r="20" fill="#6f39d9" opacity="0.85"/>
  <text x="620" y="210" text-anchor="middle" class="weight">3</text>
  <circle cx="700" cy="170" r="18" fill="#6f39d9" opacity="0.85"/>
  <text x="700" y="208" text-anchor="middle" class="weight">2</text>
  <circle cx="780" cy="170" r="16" fill="#6f39d9" opacity="0.85"/>
  <text x="780" y="206" text-anchor="middle" class="weight">1</text>
</svg>