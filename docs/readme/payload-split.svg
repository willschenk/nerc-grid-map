<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="NERC Grid Map README graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset="1" stop-color="#0e1633"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#1b2547" stroke-width="1" opacity=".38"/></pattern>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="18" fill="url(#grid)" opacity=".7"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif} .muted{fill:#8f9ac9} .small{font-size:14px} .title{fill:#fff;font-weight:800;letter-spacing:.2px} .label{fill:#fff;font-weight:700} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect x="50" y="82" width="195" height="150" rx="16" fill="#101936" stroke="#34a4d6" stroke-width="2"/>
  <text x="147.5" y="145" text-anchor="middle" class="label mono" font-size="18">orgs.json</text>
  <text x="147.5" y="180" text-anchor="middle" class="muted" font-size="14">canonical QA output</text>
  <rect x="295" y="82" width="195" height="150" rx="16" fill="#101936" stroke="#8b6cff" stroke-width="2"/>
  <text x="392.5" y="145" text-anchor="middle" class="label mono" font-size="18">orgs-render.json</text>
  <text x="392.5" y="180" text-anchor="middle" class="muted" font-size="14">first-paint map payload</text>
  <rect x="540" y="82" width="195" height="150" rx="16" fill="#101936" stroke="#22c6b8" stroke-width="2"/>
  <text x="637.5" y="145" text-anchor="middle" class="label mono" font-size="18">org-details.json</text>
  <text x="637.5" y="180" text-anchor="middle" class="muted" font-size="14">lazy detail payload</text>
  <text x="52" y="302" class="muted" font-size="16">First paint gets only what it needs. Detail loads later. QA stays canonical.</text>
</svg>