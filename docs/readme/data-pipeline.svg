<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-label="NERC Grid Map data pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset="1" stop-color="#111b3a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#23305b" stroke-width="1" opacity=".34"/></pattern>
    <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7383d8"/></marker>
  </defs>
  <rect width="920" height="270" rx="22" fill="url(#bg)"/>
  <rect width="920" height="270" rx="22" fill="url(#grid)" opacity=".75"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    .node{fill:#101936;stroke-width:3}
    .label{fill:#fff;font-size:23px;font-weight:800;letter-spacing:.2px;text-anchor:middle;dominant-baseline:middle}
    .arrow{fill:none;stroke:#7383d8;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
  </style>
  <g filter="url(#softGlow)">
    <path class="arrow" d="M166 135H209"/>
    <path class="arrow" d="M346 135H389"/>
    <path class="arrow" d="M526 135H569"/>
    <path class="arrow" d="M706 135H749"/>
  </g>
  <g>
    <rect class="node" x="34" y="96" width="132" height="78" rx="18" stroke="#6f39d9"/>
    <text class="label" x="100" y="135">Registry</text>
  </g>
  <g>
    <rect class="node" x="214" y="96" width="132" height="78" rx="18" stroke="#1ba69b"/>
    <text class="label" x="280" y="135">Ingest</text>
  </g>
  <g>
    <rect class="node" x="394" y="96" width="132" height="78" rx="18" stroke="#25b07d"/>
    <text class="label" x="460" y="135">Research</text>
  </g>
  <g>
    <rect class="node" x="574" y="96" width="132" height="78" rx="18" stroke="#3650d2"/>
    <text class="label" x="640" y="135">Build</text>
  </g>
  <g>
    <rect class="node" x="754" y="96" width="132" height="78" rx="18" stroke="#c96f20"/>
    <text class="label" x="820" y="135">Render</text>
  </g>
</svg>
